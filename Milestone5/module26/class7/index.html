<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- css -->
    <link rel="stylesheet" href="style.css" />
    <title>Nature's Platter</title>

    <!-- Font awesome cdn link -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="container m-auto bg-amber-50">
    <header class="mt-5">
      <nav class="flex justify-around items-center">
        <img
          src="./Nature-s-platter-b14-m25/assets/nav-logo.png"
          alt="Nature.com"
          class="logo cursor-pointer"
        />

        <ul class="flex gap-7 text-[16px] md:text-[18px]">
          <li><a href="#">Product</a></li>
          <li><a href="#"> Services</a></li>
          <li><a href="#"> Contact us</a></li>
        </ul>

        <div class="flex gap-4 items-center">
          <span class="cursor-pointer"
            ><i class="fa-solid fa-magnifying-glass"></i
          ></span>
          <span class="cursor-pointer"
            ><i class="fa-solid fa-cart-shopping"></i
          ></span>
          <button
            type="button"
            class="px-5 py-1 border-2 border-green-500 rounded-md cursor-pointer outline-green-300"
          >
            Login
          </button>
          <button
            type="button"
            class="px-5 py-1 bg-green-500 rounded-md text-white font-bold tracking-wide cursor-pointer hover:bg-green-400 outline-green-300"
          >
            Register
          </button>
        </div>
      </nav>
    </header>
  </body>
</html>
