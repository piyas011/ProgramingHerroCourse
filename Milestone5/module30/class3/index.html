<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Html Dom</title>
  </head>
  <body>
    <h1 id="bd">Hello Bangladesh</h1>
    <h1 id="hw">Hello World</h1>

    <p class="para">Hello this is a paragraph</p>

    <input class="inp" type="text" placeholder="Enter Your Name" />

    <button class="btn" type="submit">Submit</button>

    <script>
      const bangladesh = document.getElementById("bd");
      const world = document.getElementById("hw");
      const paragraph = document.querySelector(".para");
      const input = document.querySelector(".inp");
      const button = document.querySelector(".btn");

      bangladesh.textContent = "Hello BD";
      world.textContent = "World Hello";
    </script>

    <script src="./script.js"></script>
  </body>
</html>
